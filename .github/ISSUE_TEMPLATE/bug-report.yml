name: Problem with a claim
description: A number, link or statement in the document does not reproduce
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This repository publishes claims about code and infrastructure. If a claim
        does not reproduce, that is a bug in the document — not a difference of
        opinion. The most useful report contains the command you ran and its output.

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The tag or commit SHA of the document you read.
      placeholder: v1.0.0 or 61f4421
    validations:
      required: true

  - type: input
    id: section
    attributes:
      label: Section
      description: The heading or anchor where the claim appears.
      placeholder: "1. Что лежит в портфолио"
    validations:
      required: true

  - type: textarea
    id: claim
    attributes:
      label: What does the document say?
      description: Quote the sentence or number exactly.
    validations:
      required: true

  - type: textarea
    id: measured
    attributes:
      label: What did you measure instead?
      description: |
        Include the command and its output. If the problem is a broken link or a
        dead anchor, paste the URL and what you got.
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: Kind of problem
      options:
        - Number does not reproduce
        - Dead link or anchor
        - Statement is outdated
        - Statement is not supported by the linked repository
        - Governance or policy document is wrong for this repository
        - Something else
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues for this.
          required: true
        - label: I removed secrets, customer data and internal hostnames from everything above.
          required: true
