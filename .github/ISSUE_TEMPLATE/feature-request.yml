name: Suggestion for the document
description: Propose a section, a template or a structural change
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        The most useful part of a suggestion is how a reader would tell that it
        works. A section that cannot be checked against a real repository is a
        section that will drift.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve for the reader?
      description: Describe the situation, not the wording.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you add or change?
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: How would we know it is correct?
      description: |
        Which repository, command or artefact would prove the new section is
        true? If the answer is only "it reads well", it is not verifiable yet.
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Where does it belong?
      options:
        - Existing section
        - New section
        - Template (AGENTS.md, spec, handoff, checklist)
        - Governance or CI
        - Translation or front page
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
