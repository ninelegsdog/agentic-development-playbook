name: CI
on: [push, pull_request, workflow_call]
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v6.0.0
        with:
          python-version: "3.12"
      - name: Repository contract
        run: python3 scripts/check-repo-contract.py . scripts/repo-contract.json
