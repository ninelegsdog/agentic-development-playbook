name: CI

on: [push, pull_request, workflow_call]

permissions:
  contents: read

jobs:
  contract:
    name: Repository contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v6.0.0
        with:
          python-version: "3.12"
      - name: Contract check
        run: python3 scripts/check-repo-contract.py . scripts/repo-contract.json
      # Running only the checker proves it accepts this repository; running its
      # negative tests proves it would reject a broken one. Without this step
      # the gate is a green light wired to nothing.
      - name: Negative tests for the checker
        run: python3 scripts/check-repo-contract_test.py
      # The README quotes measured numbers; evidence/metrics.json holds the
      # measurement. Two copies drift silently, so the check is mechanical.
      - name: README numbers match the evidence
        run: |
          python3 scripts/check-evidence.py
          python3 scripts/check-evidence.py --self-test

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5.0.0
        with:
          fetch-depth: 0
      # Full history, not the tip: a secret removed in a later commit is still
      # in the history and still in every clone.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
